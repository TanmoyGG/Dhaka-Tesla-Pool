# CI — verify the monorepo on push/PR.
# Runs install + lint + typecheck + test + build for both workspaces.
name: CI

on:
  push:
    branches: [master, pre-release]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      # Runs the database integration tests (apps/api test/database.test.ts)
      # against a real PostgreSQL; they reset a dedicated *_test database.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dhaka_tesla_pool
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dhaka_tesla_pool"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/dhaka_tesla_pool
      # Placeholder Clerk keys (well-formed but NOT real): the web build fails if
      # NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY is missing because ClerkProvider runs
      # during prerendering. Real secrets are never present in CI; authenticated
      # requests are covered by unit tests with injected fakes (test/auth.test.ts).
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_cGxhY2Vob2xkZXIuaW52YWxpZC5jbGVyay5hY2NvdW50cy5kZXYk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build