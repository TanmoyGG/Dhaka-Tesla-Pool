# Dhaka Tesla Pool — Docker Compose foundation.
#
# Currently runnable:
#   docker compose up            -> starts PostgreSQL only (with healthcheck + persistent volume)
#   docker compose down -v       -> removes containers AND the DB volume (destructive)
#
# Pending (Phase 1+, when apps/web and apps/api are scaffolded):
#   The `api` and `web` services are placeholders. They are assigned the "app"
#   profile so they are excluded from a plain `docker compose up` until a real
#   Dockerfile exists in each app. Do not "complete" them with fake containers.
#   Once the apps build, remove the `profiles` lines and `docker compose up`
#   will run app containers + DB as the PRD requires.
#
# Required read: docs/development-plan.md (Phase 1, Phase 11).

name: dhaka-tesla-pool

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-dhaka_tesla_pool}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dhaka_tesla_pool}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    # PLACEHOLDER — pending apps/api scaffolding (Phase 1, Phase 11).
    profiles: ["app"]
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-dhaka_tesla_pool}
      SESSION_SECRET: ${SESSION_SECRET}
      API_PORT: ${API_PORT:-3001}
      WEB_URL: ${WEB_URL:-http://localhost:3000}
    ports:
      - "${API_PORT:-3001}:3001"
    depends_on:
      db:
        condition: service_healthy

  web:
    # PLACEHOLDER — pending apps/web scaffolding (Phase 1, Phase 11).
    profiles: ["app"]
    build:
      context: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      WEB_URL: ${WEB_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata: