# Dhaka Tesla Pool — Docker Compose (local development stack).
#
# Reproduction (PRD-required reproducible run):
#   docker compose up --build     -> builds and starts web + api + db
#   docker compose down           -> stops containers (keeps the db volume)
#   docker compose down -v        -> stops and REMOVES the db volume (destructive)
#
# Recommended local development workflow (hot reload on Windows):
#   Run the API and web locally with npm (see README "Local development"),
#   and only PostgreSQL in Docker:
#     docker compose up db
#   Full `docker compose up` is for reproducing/running the whole stack; it runs
#   production builds of web/api, so file changes require a rebuild.
#
# Required read: docs/development-plan.md (Phase 1, Phase 11).

name: dhaka-tesla-pool

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-dhaka_tesla_pool}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dhaka_tesla_pool}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-dhaka_tesla_pool}
      WEB_URL: ${WEB_URL:-http://localhost:3000}
      # Clerk API keys (server-side). The default is an INVALID build-only
      # placeholder so the stack starts without real credentials; authenticated
      # routes then fail with a clear AUTH_CONFIGURATION error. Set real values
      # in .env to run authenticated flows (see .env.example). The placeholder is
      # deliberately not shaped like a real key (sk_test_) so secret scanners do
      # not misflag it, yet still parses in @clerk/backend.
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-sk_placeholder-not-a-real-clerk-secret-key-do-not-use-000000}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-pk_test_cGxhY2Vob2xkZXIuaW52YWxpZC5jbGVyay5hY2NvdW50cy5kZXYk}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:-${WEB_URL:-http://localhost:3000}}
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # NEXT_PUBLIC_* vars are baked into the browser bundle at BUILD time.
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-pk_test_cGxhY2Vob2xkZXIuaW52YWxpZC5jbGVyay5hY2NvdW50cy5kZXYk}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    environment:
      NODE_ENV: production
      WEB_URL: ${WEB_URL:-http://localhost:3000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      # Server-side Clerk key used by the Next.js middleware/ClerkProvider SSR.
      # Placeholder default for build-only reproduction (matches the API
      # service); real key required for live Clerk flows (see .env.example).
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-sk_placeholder-not-a-real-clerk-secret-key-do-not-use-000000}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata: